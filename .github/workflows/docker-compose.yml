name: docker-compose

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar backend con mvnw package (incluye tests)
        run: cd backend && ./mvnw -B -q package

      - name: Construir y levantar servicios
        run: docker compose up -d --build

      - name: Esperar al backend (BD y RabbitMQ UP)
        run: |
          for i in $(seq 1 60); do
            h=$(curl -fs http://localhost:8080/actuator/health) && echo "$h" | grep -q '"rabbit":{"status":"UP"' && echo "$h" | grep -q '"db":{"status":"UP"' && echo "$h" && exit 0
            sleep 3
          done
          exit 1

      - name: Probar API
        run: |
          curl -fs -X POST http://localhost:8080/api/pedidos \
            -H "Content-Type: application/json" \
            -d '{"cliente":"María","total":49.90}'
          curl -fs http://localhost:8080/api/pedidos | grep NUEVO

      - name: Probar RabbitMQ (cola declarada)
        run: curl -fs -u pedidos:pedidos http://localhost:15672/api/queues/%2F/pedidos.creados

      - name: Probar frontend y proxy /api
        run: |
          curl -fs http://localhost:3000 | grep "<title>Pedidos Tienda</title>"
          curl -fs http://localhost:3000/api/pedidos | grep NUEVO

      - name: Estado y logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Detener servicios
        if: always()
        run: docker compose down -v
